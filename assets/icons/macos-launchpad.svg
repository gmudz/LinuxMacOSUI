<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E4E9"/>
      <stop offset="100%" stop-color="#BCBFC7"/>
    </linearGradient>
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <!-- App 1: Safari Blue -->
    <linearGradient id="app1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2CA8F7"/>
      <stop offset="100%" stop-color="#0570E6"/>
    </linearGradient>
    <!-- App 2: Photos Rainbow/Flower -->
    <linearGradient id="app2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F3F7"/>
    </linearGradient>
    <!-- App 3: Music Red -->
    <linearGradient id="app3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FC4760"/>
      <stop offset="100%" stop-color="#E81E3C"/>
    </linearGradient>
    <!-- App 4: Messages Green -->
    <linearGradient id="app4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55D862"/>
      <stop offset="100%" stop-color="#34B342"/>
    </linearGradient>
    <!-- App 5: Mail Blue -->
    <linearGradient id="app5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2896F3"/>
      <stop offset="100%" stop-color="#0D61D9"/>
    </linearGradient>
    <!-- App 6: Maps Orange/Teal -->
    <linearGradient id="app6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA834"/>
      <stop offset="100%" stop-color="#F26E18"/>
    </linearGradient>
    <!-- App 7: Notes Yellow -->
    <linearGradient id="app7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDD40"/>
      <stop offset="100%" stop-color="#F2BA1B"/>
    </linearGradient>
    <!-- App 8: Reminders White/Multi -->
    <linearGradient id="app8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C4DF7"/>
      <stop offset="100%" stop-color="#5829D6"/>
    </linearGradient>
    <!-- App 9: Settings Silver -->
    <linearGradient id="app9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C9EA6"/>
      <stop offset="100%" stop-color="#676970"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="13" ry="13" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Border / Highlight -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" ry="12.5" fill="none" stroke="url(#glassGloss)" stroke-width="1"/>

  <!-- Inner Inset -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="11" ry="11" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- Row 1 -->
  <!-- App 1 (Col 1, Row 1) -->
  <rect x="11.5" y="11.5" width="11" height="11" rx="2.8" fill="url(#app1)"/>
  <circle cx="17" cy="17" r="3.2" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <polygon points="17,14.5 18,17 17,19.5 16,17" fill="#FF453A"/>
  <polygon points="17,19.5 18,17 17,14.5 16,17" fill="#FFFFFF" opacity="0.8"/>

  <!-- App 2 (Col 2, Row 1) -->
  <rect x="26.5" y="11.5" width="11" height="11" rx="2.8" fill="url(#app2)"/>
  <circle cx="32" cy="15" r="1.6" fill="#FF2D55" opacity="0.85"/>
  <circle cx="34" cy="17" r="1.6" fill="#FF9500" opacity="0.85"/>
  <circle cx="32" cy="19" r="1.6" fill="#34C759" opacity="0.85"/>
  <circle cx="30" cy="17" r="1.6" fill="#007AFF" opacity="0.85"/>

  <!-- App 3 (Col 3, Row 1) -->
  <rect x="41.5" y="11.5" width="11" height="11" rx="2.8" fill="url(#app3)"/>
  <path d="M47.5 14.5 v4.2 a1.8 1.8 0 1 1 -1.2 -1.7 v-2.5 l2.5 -0.6 v0.6 z" fill="#FFFFFF"/>

  <!-- Row 2 -->
  <!-- App 4 (Col 1, Row 2) -->
  <rect x="11.5" y="26.5" width="11" height="11" rx="2.8" fill="url(#app4)"/>
  <rect x="13.8" y="29.5" width="6.4" height="4.8" rx="2.2" fill="#FFFFFF"/>
  <polygon points="14.8,33.5 14.8,35.5 17,33.5" fill="#FFFFFF"/>

  <!-- App 5 (Col 2, Row 2) -->
  <rect x="26.5" y="26.5" width="11" height="11" rx="2.8" fill="url(#app5)"/>
  <rect x="28.5" y="29.5" width="7" height="5" rx="0.8" fill="#FFFFFF"/>
  <polyline points="28.7,29.8 32,32.2 35.3,29.8" fill="none" stroke="#0D61D9" stroke-width="0.8"/>

  <!-- App 6 (Col 3, Row 2) -->
  <rect x="41.5" y="26.5" width="11" height="11" rx="2.8" fill="url(#app6)"/>
  <path d="M44.5 32 a2.5 2.5 0 0 1 5 0 c0 1.8 -2.5 4.5 -2.5 4.5 c0 0 -2.5 -2.7 -2.5 -4.5 z" fill="#FFFFFF"/>
  <circle cx="47" cy="32" r="1" fill="#F26E18"/>

  <!-- Row 3 -->
  <!-- App 7 (Col 1, Row 3) -->
  <rect x="11.5" y="41.5" width="11" height="11" rx="2.8" fill="url(#app7)"/>
  <rect x="11.5" y="41.5" width="11" height="3" rx="1.5" fill="#FF9500"/>
  <line x1="14" y1="46.5" x2="20" y2="46.5" stroke="#996600" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="14" y1="49" x2="18" y2="49" stroke="#996600" stroke-width="0.8" stroke-linecap="round"/>

  <!-- App 8 (Col 2, Row 3) -->
  <rect x="26.5" y="41.5" width="11" height="11" rx="2.8" fill="url(#app8)"/>
  <circle cx="32" cy="47" r="3.2" fill="#FFFFFF"/>
  <path d="M30.5 47 l1.2 1.2 l2.2 -2.4" fill="none" stroke="#5829D6" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- App 9 (Col 3, Row 3) -->
  <rect x="41.5" y="41.5" width="11" height="11" rx="2.8" fill="url(#app9)"/>
  <circle cx="47" cy="47" r="2.8" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="47" cy="47" r="1.2" fill="#FFFFFF"/>
</svg>
