<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadowA" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B93F7"/>
      <stop offset="100%" stop-color="#056DE6"/>
    </linearGradient>
    <linearGradient id="shineA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="13" ry="13" fill="url(#bgGradA)" filter="url(#shadowA)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" ry="12.5" fill="none" stroke="url(#shineA)" stroke-width="1"/>

  <!-- The Iconic Apple Applications "A" made of Pencil, Ruler & Paintbrush -->
  <g filter="url(#innerGlow)">
    <!-- Ruler (Left Arm) -->
    <path d="M19 46.5 L31 16.5 C31.5 15.2 32.8 14.5 34 15 C35.2 15.5 35.8 16.8 35.3 18 L23.3 48 C22.8 49.2 21.5 49.8 20.3 49.3 C19.1 48.8 18.5 47.7 19 46.5 Z" fill="#FFFFFF"/>
    
    <!-- Paintbrush (Right Arm) -->
    <path d="M45 46.5 L33 16.5 C32.5 15.2 31.2 14.5 30 15 C28.8 15.5 28.2 16.8 28.7 18 L40.7 48 C41.2 49.2 42.5 49.8 43.7 49.3 C44.9 48.8 45.5 47.7 45 46.5 Z" fill="#FFFFFF"/>
    
    <!-- Pencil (Horizontal Crossbar) -->
    <path d="M15.5 37.5 L48.5 37.5 C49.6 37.5 50.5 36.6 50.5 35.5 C50.5 34.4 49.6 33.5 48.5 33.5 L15.5 33.5 C14.4 33.5 13.5 34.4 13.5 35.5 C13.5 36.6 14.4 37.5 15.5 37.5 Z" fill="#FFFFFF"/>

    <!-- Subtle tool details on crossbar & arms -->
    <!-- Ruler markings -->
    <line x1="22" y1="41" x2="24" y2="41.8" stroke="#056DE6" stroke-width="0.8" opacity="0.6"/>
    <line x1="24" y1="36" x2="26" y2="36.8" stroke="#056DE6" stroke-width="0.8" opacity="0.6"/>
    <line x1="26" y1="31" x2="28" y2="31.8" stroke="#056DE6" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="26" x2="30" y2="26.8" stroke="#056DE6" stroke-width="0.8" opacity="0.6"/>

    <!-- Pencil tip -->
    <polygon points="13.5,35.5 16,33.5 16,37.5" fill="#056DE6" opacity="0.6"/>
  </g>
</svg>
