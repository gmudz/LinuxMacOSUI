# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.5

# Arabic Unicode Mapping (Explicit single font family per symbol_map)
symbol_map U+0600-U+06FF,U+0750-U+077F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF Noto Sans Arabic

# URL Handling & Browser Interaction (Ctrl + Click to open links)
detect_urls yes
url_color #58a6ff
url_style curly
open_url_with default
underline_hyperlinks hover
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# Window layout & macOS Glass Padding
window_padding_width 12
hide_window_decorations yes
remember_window_size  yes
initial_window_width  960
initial_window_height 600

# macOS Frosted Glass & Transparency
background_opacity 0.85
dynamic_background_opacity yes
background_blur 32

# macOS Beam Cursor
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
scrollback_lines 20000

# Window splitting / layout
enabled_layouts splits,stack,tall,fat
linux_display_server wayland

# Performance
sync_to_monitor yes
input_delay 0
repaint_delay 6

# Keybindings for Split Panes
map --allow-fallback=shifted,ascii ctrl+shift+d launch --location=hsplit --cwd=current
map --allow-fallback=shifted,ascii ctrl+shift+r launch --location=vsplit --cwd=current
map --allow-fallback=shifted,ascii alt+left neighboring_window left
map --allow-fallback=shifted,ascii alt+right neighboring_window right
map --allow-fallback=shifted,ascii alt+up neighboring_window up
map --allow-fallback=shifted,ascii alt+down neighboring_window down
map --allow-fallback=shifted,ascii ctrl+shift+w close_window

# Tab management (macOS Style)
tab_bar_style powerline
tab_powerline_style slanted
map --allow-fallback=shifted,ascii ctrl+shift+t new_tab
map --allow-fallback=shifted,ascii ctrl+shift+q close_tab
map --allow-fallback=shifted,ascii ctrl+tab next_tab
map --allow-fallback=shifted,ascii ctrl+shift+tab previous_tab

# Copy & Paste (Smart Image & Text Pasting)
map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v kitten smart_paste.py
map --allow-fallback=shifted,ascii ctrl+v kitten smart_paste.py

# Font size controls
map --allow-fallback=shifted,ascii ctrl+shift+plus change_font_size all +1.0
map --allow-fallback=shifted,ascii ctrl+shift+minus change_font_size all -1.0
map --allow-fallback=shifted,ascii ctrl+shift+backspace change_font_size all 0

# Live opacity controls
map --allow-fallback=shifted,ascii ctrl+shift+o set_background_opacity +0.05
map --allow-fallback=shifted,ascii ctrl+shift+u set_background_opacity -0.05
map --allow-fallback=shifted,ascii ctrl+shift+0 set_background_opacity default

# Reload config instantly
map --allow-fallback=shifted,ascii ctrl+shift+f5 load_config_file

# Theme (Dynamic Material You / DMS Theme)
include dank-theme.conf
include dank-tabs.conf
